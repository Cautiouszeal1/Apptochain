<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>AppToChain — Discover. Analyse. Grow.</title>
<meta name="description" content="The discovery and intelligence platform for on-chain applications. Live TVL, rankings, trending dApps and chain analytics across every major blockchain.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22white%22>⛓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root{
  --bg:#050506;
  --bg-soft:#08080a;
  --elevated:#0f0f12;
  --surface:#121214;
  --surface-2:#18181c;
  --border:#232327;
  --border-strong:#333338;
  --text:#f5f5f7;
  --text-dim:#9a9aa2;
  --text-faint:#5c5c64;
  --chrome-1:#f5f5f8;
  --chrome-2:#a9a9b2;
  --accent:#f5f5f8;
  --accent-2:#c4c4cc;
  --accent-soft:rgba(255,255,255,.06);
  --accent-grad: linear-gradient(180deg, #ffffff, #b7b7c0);
  --pos:#3ed598;
  --pos-bg:rgba(62,213,152,.12);
  --neg:#ff5c6c;
  --neg-bg:rgba(255,92,108,.12);
  --focus:#e8e8ee;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:20px;
  --sidebar-w:248px;
  --shadow-card: 0 1px 0 rgba(255,255,255,.03) inset, 0 20px 40px -24px rgba(0,0,0,.75);
  --glow-accent: 0 0 0 1px rgba(255,255,255,.08), 0 8px 30px -12px rgba(255,255,255,.12);
  --font-display:'Sora', 'Segoe UI', sans-serif;
  --font-body:'Inter', 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
}
html[data-theme="light"]{
  --bg:#f6f6f4;
  --bg-soft:#efefec;
  --elevated:#ffffff;
  --surface:#ffffff;
  --surface-2:#f2f2ef;
  --border:#e2e2dd;
  --border-strong:#cfcfc8;
  --text:#131316;
  --text-dim:#63636b;
  --text-faint:#9a9aa0;
  --chrome-1:#131316;
  --chrome-2:#48484f;
  --accent:#131316;
  --accent-2:#48484f;
  --accent-soft:rgba(0,0,0,.05);
  --accent-grad: linear-gradient(180deg, #1a1a1e, #45454c);
  --pos:#0f9d63;
  --pos-bg:rgba(15,157,99,.1);
  --neg:#d8354a;
  --neg-bg:rgba(216,53,74,.1);
  --glow-accent: 0 0 0 1px rgba(0,0,0,.05), 0 8px 24px -12px rgba(0,0,0,.15);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;width:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:var(--focus);color:#fff}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

/* ============ Globe ambient canvas ============ */
#globe-canvas{
  position:fixed;
  top:-10%;
  right:-8%;
  width:60vw;
  height:60vw;
  max-width:820px;
  max-height:820px;
  pointer-events:none;
  opacity:.55;
  z-index:0;
}
html[data-theme="light"] #globe-canvas{opacity:.18}

/* ============ Layout shell ============ */
#app{display:flex;position:relative;z-index:1;min-height:100vh;max-width:100vw;overflow-x:hidden}

.mobile-topbar{display:none}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  height:100vh;
  position:sticky;
  top:0;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--border);
  padding:20px 14px;
  background:var(--bg-soft);
  z-index:20;
}
.sidebar-brand{display:flex;align-items:center;gap:9px;padding:6px 8px 22px}
.brand-word{
  font-family:var(--font-display);
  font-weight:700;
  font-size:16.5px;
  letter-spacing:.02em;
  color:var(--text);
}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-section-label{
  font-size:10.5px;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--text-faint);
  padding:16px 12px 6px;
  font-weight:700;
}
.nav-section-label:first-child{padding-top:4px}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;
  border-radius:var(--radius-sm);
  color:var(--text-dim);
  font-size:13.6px;
  font-weight:600;
  cursor:pointer;
  transition:background .12s,color .12s;
  position:relative;
  white-space:nowrap;
}
.nav-item svg{flex-shrink:0;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--surface-2);color:var(--text)}
.nav-item.active::before{
  content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:16px;border-radius:2px;background:var(--chrome-1);
}
.nav-item .nav-badge{
  margin-left:auto;font-size:10px;font-family:var(--font-mono);
  background:var(--surface-2);border:1px solid var(--border-strong);
  padding:1px 6px;border-radius:20px;color:var(--text-faint);
}

.sidebar-cta{
  margin:14px 4px 10px;
  padding:16px;
  border-radius:var(--radius-md);
  background:linear-gradient(155deg, var(--surface-2), var(--surface));
  border:1px solid var(--border-strong);
}
.sidebar-cta-eyebrow{margin:0 0 4px;font-size:12.5px;font-weight:800;color:var(--text)}
.sidebar-cta-copy{margin:0 0 12px;font-size:11.5px;line-height:1.5;color:var(--text-dim)}

.sidebar-foot{display:flex;align-items:center;gap:10px;padding:10px 8px 2px;border-top:1px solid var(--border);margin-top:6px}
.sidebar-foot-label{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono)}

.sidebar-scrim{display:none}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:15;
  display:flex;align-items:center;gap:16px;
  padding:14px 28px;
  border-bottom:1px solid var(--border);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
}
.search-wrap{
  position:relative;
  flex:1;max-width:440px;
  display:flex;align-items:center;gap:8px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px 12px;
  color:var(--text-faint);
}
.search-wrap:focus-within{border-color:var(--border-strong)}
.search-wrap input{
  border:none;outline:none;background:transparent;color:var(--text);
  font-size:13.5px;width:100%;font-family:var(--font-body);
}
.search-wrap input::placeholder{color:var(--text-faint)}
.search-wrap kbd{
  font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
  border:1px solid var(--border-strong);border-radius:4px;padding:1px 6px;
}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:var(--elevated);border:1px solid var(--border-strong);
  border-radius:var(--radius-md);box-shadow:var(--shadow-card);
  max-height:360px;overflow-y:auto;display:none;z-index:40;
}
.search-results.open{display:block}
.search-result-row{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.search-result-row:last-child{border-bottom:none}
.search-result-row:hover{background:var(--surface-2)}
.search-result-empty{padding:16px;color:var(--text-faint);font-size:12.5px;text-align:center}

.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.badge-count{
  position:absolute;top:2px;right:2px;
  background:var(--focus);color:#fff;font-size:9.5px;font-weight:700;
  min-width:15px;height:15px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);
}

.icon-btn{
  position:relative;
  width:36px;height:36px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid transparent;color:var(--text-dim);
  cursor:pointer;transition:background .12s,border-color .12s,color .12s;
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--border);color:var(--text)}

.btn{
  font-family:var(--font-body);font-weight:700;font-size:13px;
  padding:9px 16px;border-radius:9px;border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--text);cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  transition:transform .1s, background .12s, border-color .12s;
  white-space:nowrap;
}
.btn:hover{background:var(--elevated);border-color:var(--chrome-2)}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(180deg, var(--chrome-1), var(--chrome-2));
  color:#08080a;border-color:transparent;
}
.btn-primary:hover{filter:brightness(1.08)}
.btn-block{width:100%}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px}
.btn-ghost{background:transparent;border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.view{flex:1;padding:26px 28px 60px;max-width:1440px;width:100%;margin:0 auto}

.app-footer{
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  padding:18px 28px;border-top:1px solid var(--border);
  font-size:11.5px;color:var(--text-faint);
}
.app-footer-links{display:flex;gap:16px}
.app-footer-links a:hover{color:var(--text)}

/* ============ Typography scale ============ */
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);font-weight:700}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:.01em}
.page-title{font-size:30px;margin-bottom:4px}
.page-sub{color:var(--text-dim);font-size:14px;margin:0 0 22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 14px}
.section-head h2{font-size:18px}
.section-head a{font-size:12.5px;color:var(--text-dim);font-weight:700}
.section-head a:hover{color:var(--text)}

.mono{font-family:var(--font-mono)}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.pill-delta{
  font-family:var(--font-mono);font-size:11.5px;font-weight:600;
  padding:2px 7px;border-radius:6px;
}
.pill-delta.pos{background:var(--pos-bg)}
.pill-delta.neg{background:var(--neg-bg)}

/* ============ Hero ============ */
.hero{display:flex;justify-content:space-between;gap:40px;padding:18px 0 8px;align-items:flex-start;position:relative}
.hero::before{
  content:'';position:absolute;top:-120px;right:-160px;width:480px;height:480px;
  background:radial-gradient(circle, var(--accent-soft), transparent 70%);
  pointer-events:none;z-index:-1;
}
.dapp-card:hover, .featured-card:hover{box-shadow:var(--glow-accent)}
.cat-chip .ic{font-size:20px;margin-bottom:6px;filter:drop-shadow(0 0 8px currentColor)}
.hero-copy{max-width:560px}
.hero h1{font-size:38px;line-height:1.12;margin-bottom:14px}
.hero h1 .hl{
  background:linear-gradient(120deg, var(--chrome-1), var(--chrome-2) 60%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{color:var(--text-dim);font-size:15px;line-height:1.6;margin-bottom:0}
.hero-actions{display:flex;gap:10px;margin-top:20px}

/* ============ Stat cards ============ */
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:26px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:16px 18px;box-shadow:var(--shadow-card);
}
.stat-card .stat-val{font-family:var(--font-mono);font-size:21px;font-weight:600;letter-spacing:-.01em}
.stat-card .stat-label{font-size:11.5px;color:var(--text-dim);margin-top:4px}
.stat-card .stat-delta{margin-top:8px}
.skel{position:relative;overflow:hidden;background:var(--surface-2);border-radius:6px;color:transparent!important}
.skel::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
  animation:shimmer 1.3s infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ============ Card grids ============ */
.grid{display:grid;gap:14px}
.grid-6{grid-template-columns:repeat(6,1fr)}
.grid-5{grid-template-columns:repeat(5,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}

.dapp-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:15px;cursor:pointer;transition:border-color .14s, transform .14s;
  box-shadow:var(--shadow-card);
}
.dapp-card:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.dapp-rank{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}
.dapp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dapp-logo{
  width:34px;height:34px;border-radius:9px;object-fit:cover;background:var(--surface-2);
  border:1px solid var(--border);
}
.dapp-star{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:4px;display:flex}
.dapp-star.active{color:#f5c451}
.dapp-name{font-weight:700;font-size:13.8px;margin:2px 0 1px}
.dapp-cat{font-size:11px;color:var(--text-faint)}
.dapp-metrics{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.dapp-tvl{font-family:var(--font-mono);font-weight:600;font-size:14px}

.featured-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:16px;box-shadow:var(--shadow-card);
}
.featured-cat{
  display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-faint);background:var(--surface-2);
  border:1px solid var(--border);border-radius:20px;padding:2px 9px;margin-bottom:10px;
}
.featured-card h3{font-size:14.5px;margin-bottom:6px}
.featured-card p{font-size:12px;color:var(--text-dim);line-height:1.5;margin:0 0 14px;min-height:36px}
.featured-tvl{font-family:var(--font-mono);font-weight:700;font-size:15px}

/* ============ Panels (charts) ============ */
.panel-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:14px;margin-top:22px}
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:18px;box-shadow:var(--shadow-card);
}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.panel-title{font-size:12.5px;color:var(--text-dim);font-weight:700}
.panel-big{font-family:var(--font-mono);font-size:22px;font-weight:600}
.tf-toggle{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:2px}
.tf-toggle button{
  border:none;background:transparent;color:var(--text-faint);font-size:10.5px;font-weight:700;
  padding:4px 8px;border-radius:5px;cursor:pointer;font-family:var(--font-mono);
}
.tf-toggle button.active{background:var(--elevated);color:var(--text)}
.chart-box{width:100%;height:150px}
.legend-list{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-name{color:var(--text-dim);flex:1}
.legend-val{font-family:var(--font-mono);font-weight:600}

/* ============ Category chips ============ */
.cat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cat-chip{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:16px 10px;text-align:center;cursor:pointer;transition:border-color .14s, transform .14s;
}
.cat-chip:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.cat-chip .lbl{font-size:12px;font-weight:700}
.cat-chip .cnt{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono)}

/* ============ Chain grid (supported chains) ============ */
.chain-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chain-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:9px 13px;font-size:12.5px;font-weight:700;
}
.chain-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0}

/* ============ Toolbar (filters) ============ */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar select, .toolbar .tbtn{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;
  font-family:var(--font-body);
}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:6px 13px;border-radius:20px;border:1px solid var(--border);
  font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer;background:var(--surface);
}
.chip.active{background:var(--chrome-1);color:#08080a;border-color:transparent}

/* ============ Tables ============ */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{
  text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-faint);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;white-space:nowrap;
}
thead th:hover{color:var(--text)}
thead th.sorted{color:var(--text)}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
.row-name{display:flex;align-items:center;gap:10px;font-weight:700}
.row-name img{width:24px;height:24px;border-radius:6px}
td.num{font-family:var(--font-mono);text-align:right}
th.num{text-align:right}

/* ============ Empty / loading ============ */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-dim);border:1px dashed var(--border-strong);
  border-radius:var(--radius-md);
}
.empty-state h3{margin-bottom:6px;font-size:15px;color:var(--text)}
.empty-state p{font-size:13px;margin:0 0 16px}

/* ============ Detail drawer ============ */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s;
}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:420px;max-width:92vw;
  background:var(--elevated);border-left:1px solid var(--border-strong);
  z-index:61;transform:translateX(100%);transition:transform .22s ease;
  overflow-y:auto;padding:22px;
}
.drawer.open{transform:translateX(0)}
.drawer-close{float:right}

/* ============ Forms ============ */
.form-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:24px;max-width:560px;box-shadow:var(--shadow-card);
}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--text-dim)}
.field input, .field select, .field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:9px;font-size:13.5px;font-family:var(--font-body);
}
.field textarea{resize:vertical;min-height:90px}
.field-row{display:flex;gap:12px}
.field-row .field{flex:1}

/* ============ Toast ============ */
.toast-root{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--elevated);border:1px solid var(--border-strong);border-radius:10px;
  padding:11px 16px;font-size:13px;box-shadow:var(--shadow-card);
  animation:toast-in .18s ease;
}

<script>
/* ============================================================
   ApptoChain — single-file SPA
   Data: DefiLlama public API (protocols, chains, global TVL, dex volume)
   No API keys required. No build step.
   ============================================================ */
(function(){
"use strict";

/* ---------------- Utilities ---------------- */
function fmtUSD(n){
  if(n==null||isNaN(n)) return "—";
  const abs=Math.abs(n);
  if(abs>=1e12) return "$"+(n/1e12).toFixed(2)+"T";
  if(abs>=1e9) return "$"+(n/1e9).toFixed(2)+"B";
  if(abs>=1e6) return "$"+(n/1e6).toFixed(2)+"M";
  if(abs>=1e3) return "$"+(n/1e3).toFixed(1)+"K";
  return "$"+n.toFixed(2);
}
function fmtNum(n){
  if(n==null||isNaN(n)) return "—";
  const abs=Math.abs(n);
  if(abs>=1e9) return (n/1e9).toFixed(2)+"B";
  if(abs>=1e6) return (n/1e6).toFixed(2)+"M";
  if(abs>=1e3) return (n/1e3).toFixed(1)+"K";
  return String(n);
}
function fmtPct(n){
  if(n==null||isNaN(n)) return null;
  const s=(n>=0?"+":"")+n.toFixed(2)+"%";
  return s;
}
function deltaSpan(n, cls){
  cls=cls||"pill-delta";
  if(n==null||isNaN(n)) return `<span class="${cls}">—</span>`;
  const dir=n>=0?"pos":"neg";
  return `<span class="${cls} ${dir}">${n>=0?"+":""}${n.toFixed(2)}%</span>`;
}
function timeAgo(unixSec){
  const s=Math.floor(Date.now()/1000)-unixSec;
  if(s<60) return s+"s ago";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function debounce(fn, ms){
  let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), ms); };
}
function slug(str){ return String(str||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }
function logoFallback(name){
  const initial = (name||"?").trim().charAt(0).toUpperCase();
  return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" rx="9" fill="#16161c"/><text x="50%" y="56%" font-family="Manrope,sans-serif" font-size="17" font-weight="700" fill="#8b8b96" text-anchor="middle">${initial}</text></svg>`)}`;
}
function onImgErr(img){ img.onerror=null; img.src=logoFallback(img.dataset.name||"?"); }
function toast(msg){
  const root=document.getElementById("toast-root");
  const el=document.createElement("div");
  el.className="toast"; el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* ---------------- Category mapping ---------------- */
const CATEGORY_DEFS = [
  {id:"defi", label:"DeFi", icon:"◈", color:"#5b8cff", match:["Dexes","Lending","Yield","Yield Aggregator","CDP","Liquid Staking","Derivatives","Options","Synthetics","Insurance","Staking Pool","Leveraged Farming","Options Vault","Liquidity manager","Restaking","Liquid Restaking","Farm"]},
  {id:"ai", label:"AI x Crypto", icon:"✦", color:"#c77dff", match:["AI Agents","AI"]},
  {id:"gaming", label:"Gaming", icon:"◆", color:"#ff9f45", match:["Gaming","Metaverse","Play to Earn"]},
  {id:"gambling", label:"Gambling", icon:"◎", color:"#ff5c9c", match:["Gambling","Prediction Market","Casino","Betting"]},
  {id:"nfts", label:"NFTs", icon:"▣", color:"#4dd0e1", match:["NFT Marketplace","NFT Lending"]},
  {id:"depin", label:"DePIN", icon:"⌬", color:"#2fdc8f", match:["DePIN"]},
  {id:"social", label:"Social", icon:"◍", color:"#ffd166", match:["SocialFi","Social"]},
  {id:"rwa", label:"Real-World Assets", icon:"◧", color:"#7cd992", match:["RWA","Onchain Capital Allocator"]},
  {id:"infrastructure", label:"Infrastructure", icon:"▤", color:"#9598a8", match:["Oracle","Indexer","Infrastructure","Services","Staking"]},
  {id:"launchpads", label:"Launchpads", icon:"▲", color:"#a68bff", match:["Launchpad"]},
  {id:"wallets", label:"Wallets", icon:"◫", color:"#6cc4ff", match:["Wallets","Wallet"]},
  {id:"bridges", label:"Bridges", icon:"⇄", color:"#5bd1c9", match:["Bridge","Cross Chain","Chain"]},
  {id:"stablecoins", label:"Stablecoins", icon:"●", color:"#7cd992", match:["Algo-Stables","Stablecoin"]},
  {id:"payments", label:"Payments", icon:"◐", color:"#ff8a65", match:["Payments"]},
];
function classify(cat){
  if(!cat) return "infrastructure";
  for(const c of CATEGORY_DEFS){ if(c.match.some(m=>cat.toLowerCase().includes(m.toLowerCase()))) return c.id; }
  return "infrastructure";
}
function catLabel(id){ const c=CATEGORY_DEFS.find(c=>c.id===id); return c?c.label:id; }
function catColor(id){ return "var(--text-dim)"; }
function catTag(id, cls){
  return `<span class="${cls||'featured-cat'}">${esc(catLabel(id))}</span>`;
}

/* ---------------- Chain color palette ---------------- */
const CHAIN_COLORS = {
  Ethereum:"#7c9cff", BSC:"#f0b90b", Binance:"#f0b90b", Solana:"#9945ff", Arbitrum:"#28a0f0",
  Polygon:"#8247e5", Optimism:"#ff0420", Avalanche:"#e84142", Base:"#0052ff", Tron:"#ff0013",
  Sui:"#6fbcf0", Aptos:"#00d4a0", Fantom:"#1969ff", Cronos:"#002d74", zkSync:"#8c8dfc", default:"#8b8b96"
};
function chainColor(name){ return CHAIN_COLORS[name]||CHAIN_COLORS.default; }
const CHAIN_LOGOS = {
  Ethereum:"Ξ", BSC:"◆", Solana:"◎", Arbitrum:"◭", Polygon:"⬡", Optimism:"○", Avalanche:"▲",
  Base:"◐", Tron:"Ⓣ", Sui:"∿", Aptos:"Ⓐ"
};

/* ---------------- Data layer (DefiLlama) ---------------- */
const DL = "https://api.llama.fi";
const COINS = "https://coins.llama.fi";
const STORE = {
  protocols: [], chains: [], globalChart: [], dexVolume24h: null, loading:true, error:null, loadedAt:null
};

async function fetchJSON(url, timeoutMs=15000){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const res = await fetch(url, {signal:ctrl.signal});
    if(!res.ok) throw new Error("HTTP "+res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}

async function loadData(force){
  if(STORE.loadedAt && !force && (Date.now()-STORE.loadedAt < 90000)) return STORE;
  STORE.loading = true; STORE.error=null;
  try{
    const [protocols, chains, chart, dexs] = await Promise.all([
      fetchJSON(DL+"/protocols"),
      fetchJSON(DL+"/v2/chains"),
      fetchJSON(DL+"/charts").catch(()=>[]),
      fetchJSON(DL+"/overview/dexs?excludeTotalDataChart=true&excludeTotalDataChartBreakdown=true").catch(()=>null),
    ]);
    STORE.protocols = (protocols||[])
      .filter(p=>p && p.name && p.tvl!=null)
      .map(p=>({
        id:p.id, name:p.name, symbol:p.symbol, category:p.category||"Services",
        bucket: classify(p.category),
        tvl:p.tvl||0, change1h:p.change_1h, change1d:p.change_1d, change7d:p.change_7d,
        chains:p.chains||[], chain:p.chain, logo:p.logo, url:p.url, gecko_id:p.gecko_id,
        description:p.description||"", slug: p.slug || slug(p.name),
      }))
      .sort((a,b)=>b.tvl-a.tvl);
    STORE.chains = (chains||[])
      .filter(c=>c && c.tvl)
      .sort((a,b)=>b.tvl-a.tvl)
      .slice(0,60);
    STORE.globalChart = Array.isArray(chart) ? chart.slice(-120) : [];
    STORE.dexVolume24h = dexs && dexs.total24h ? dexs.total24h : null;
    STORE.dexProtocols = dexs && dexs.protocols ? dexs.protocols : [];
    STORE.loading=false; STORE.loadedAt=Date.now();
  }catch(e){
    STORE.loading=false; STORE.error = "Live data is temporarily unavailable. Retrying shortly.";
    console.error(e);
    setTimeout(()=>loadData(true).then(render), 8000);
  }
  return STORE;
}

/* ---------------- Watchlist / Alerts (localStorage) ---------------- */
const LS_WATCH = "atc_watchlist", LS_ALERTS = "atc_alerts", LS_THEME="atc_theme";
function getWatchlist(){ try{return JSON.parse(localStorage.getItem(LS_WATCH)||"[]")}catch{return []} }
function setWatchlist(arr){ localStorage.setItem(LS_WATCH, JSON.stringify(arr)); updateBadges(); }
function toggleWatch(id, name){
  let w = getWatchlist();
  if(w.includes(id)){ w=w.filter(x=>x!==id); toast(`Removed ${name} from watchlist`); }
  else { w.push(id); toast(`Added ${name} to watchlist`); }
  setWatchlist(w);
}
function getAlerts(){ try{return JSON.parse(localStorage.getItem(LS_ALERTS)||"[]")}catch{return []} }
function setAlerts(arr){ localStorage.setItem(LS_ALERTS, JSON.stringify(arr)); updateBadges(); }
function updateBadges(){
  const w=getWatchlist(), a=getAlerts().filter(x=>!x.triggered);
  const wb=document.getElementById("watchlist-count"), ab=document.getElementById("alerts-count");
  const mwb=document.getElementById("mobile-watchlist-count"), mab=document.getElementById("mobile-alerts-count");
  if(w.length){wb.style.display="flex";wb.textContent=w.length;mwb.style.display="flex";mwb.textContent=w.length;}
  else {wb.style.display="none";mwb.style.display="none";}
  if(a.length){ab.style.display="flex";ab.textContent=a.length;mab.style.display="flex";mab.textContent=a.length;}
  else {ab.style.display="none";mab.style.display="none";}
}

/* expose to global for inline handlers */
window.ATC = { toggleWatch, getWatchlist };

/* ---------------- Router ---------------- */
const ROUTES = [];
function route(pattern, handler){ ROUTES.push({re: pathToRegex(pattern), keys: pathKeys(pattern), handler}); }
function pathKeys(p){ return (p.match(/:[a-zA-Z]+/g)||[]).map(k=>k.slice(1)); }
function pathToRegex(p){ return new RegExp("^"+p.replace(/:[a-zA-Z]+/g,"([^/]+)")+"$"); }
function currentPath(){ return (location.hash.slice(1)||"/"); }
function navigate(path){ location.hash = "#"+path; }

async function render(){
  const path = currentPath().split("?")[0];
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.toggle("active", el.dataset.path===path || (el.dataset.match && path.startsWith(el.dataset.match))));
  for(const r of ROUTES){
    const m = path.match(r.re);
    if(m){
      const params={}; r.keys.forEach((k,i)=>params[k]=decodeURIComponent(m[i+1]));
      await r.handler(params);
      window.scrollTo(0,0);
      closeMobileSidebar();
      return;
    }
  }
  renderNotFound();
}
window.addEventListener("hashchange", render);

function setView(html){ document.getElementById("view").innerHTML = html; }

/* ---------------- Sidebar nav ---------------- */
const NAV = [
  {section:"Discover", items:[
    {id:"home", label:"Home", path:"/", icon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'},

/* ---------------- Ambient globe canvas ---------------- */
function initGlobe(){
  const canvas = document.getElementById("globe-canvas");
  const ctx = canvas.getContext("2d");
  let w,h,dpr;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = w*dpr; canvas.height = h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener("resize", debounce(size, 150));
  size();

  const N_LAT=11, N_LON=20;
  const pts=[];
  for(let i=0;i<N_LAT;i++){
    const lat = Math.PI*(-0.5 + i/(N_LAT-1));
    for(let j=0;j<N_LON;j++){
      const lon = 2*Math.PI*j/N_LON;
      pts.push({ x: Math.cos(lat)*Math.cos(lon), y: Math.sin(lat), z: Math.cos(lat)*Math.sin(lon) });
    }
  }
  let angle=0;
  function frame(){
    const cx=w*0.52, cy=h*0.5, radius=Math.min(w,h)*0.42;
    ctx.clearRect(0,0,w,h);
    const isLight = document.documentElement.getAttribute("data-theme")==="light";
    const dotColor = isLight? "16,16,20" : "241,241,244";
    const lineColor = isLight? "16,16,20" : "230,230,235";

    const proj = pts.map(p=>{
      const cosA=Math.cos(angle), sinA=Math.sin(angle);
      const x = p.x*cosA - p.z*sinA;
      const z = p.x*sinA + p.z*cosA;
      const y = p.y;
      const scale = 1/(2 - z*0.6);
      return {sx: cx + x*radius*scale, sy: cy + y*radius*scale, z, scale};
    });
    ctx.lineWidth=0.6;
    for(let i=0;i<proj.length;i++){
      if(proj[i].z < -0.15) continue;
      for(let j=i+1;j<proj.length;j++){
        if(proj[j].z < -0.15) continue;
        const dx=proj[i].sx-proj[j].sx, dy=proj[i].sy-proj[j].sy;
        const d = Math.sqrt(dx*dx+dy*dy);
        if(d < radius*0.16){
          const alpha = (1-d/(radius*0.16)) * 0.16;
          ctx.strokeStyle = `rgba(${lineColor},${alpha})`;
          ctx.beginPath(); ctx.moveTo(proj[i].sx,proj[i].sy); ctx.lineTo(proj[j].sx,proj[j].sy); ctx.stroke();
        }
      }
    }
    for(const p of proj){
      const depth = (p.z+1)/2;
      const r = 1 + depth*1.6;
      const alpha = 0.15 + depth*0.55;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${dotColor},${alpha})`;
      ctx.arc(p.sx, p.sy, r, 0, Math.PI*2);
      ctx.fill();
    }
    if(!reduceMotion) angle += 0.0016;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------------- Mini charts (canvas, no deps) ---------------- */
function drawLineChart(canvas, values){
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio||1,2);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  if(!values || values.length<2) return;
  const min=Math.min(...values), max=Math.max(...values);
  const pad=4;
  const stepX = (w-pad*2)/(values.length-1);
  const isLight = document.documentElement.getAttribute("data-theme")==="light";
  const lineColor = isLight? "#101014":"#eef0f4";
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, isLight? "rgba(16,16,20,.18)":"rgba(238,240,244,.22)");
  grad.addColorStop(1, isLight? "rgba(16,16,20,0)":"rgba(238,240,244,0)");
  function yOf(v){ if(max===min) return h/2; return h-pad - ((v-min)/(max-min))*(h-pad*2); }
  ctx.beginPath();
  values.forEach((v,i)=>{ const x=pad+i*stepX, y=yOf(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.lineTo(pad+(values.length-1)*stepX, h); ctx.lineTo(pad,h); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath();
  values.forEach((v,i)=>{ const x=pad+i*stepX, y=yOf(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle=lineColor; ctx.lineWidth=1.8; ctx.lineJoin="round"; ctx.stroke();
}
function drawDonut(canvas, slices){
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio||1,2);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2, rOuter=Math.min(w,h)/2-4, rInner=rOuter*0.62;
  const total = slices.reduce((s,x)=>s+x.value,0) || 1;
  let start=-Math.PI/2;
  slices.forEach(sl=>{
    const angle = (sl.value/total)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rOuter,start,start+angle);
    ctx.closePath();
    ctx.fillStyle=sl.color;
    ctx.fill();
    start += angle;
  });
  ctx.globalCompositeOperation="destination-out";
  ctx.beginPath(); ctx.arc(cx,cy,rInner,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation="source-over";
}

function bindGlobalCardEvents(root){

let rankSort = {key:"tvl", dir:-1};
async function renderRankings(){
  await loadData();

        <th data-k="bucket">Category</th>
        <th class="num" data-k="tvl">TVL</th>
        <th class="num" data-k="change1h">1h</th>
        <th class="num" data-k="change1d">24h</th>
        <th class="num" data-k="change7d">7d</th>
      </tr></thead>
      <tbody id="rank-body"></tbody>
    </table></div>
  `);
  document.querySelectorAll("thead th[data-k]").forEach(th=>{
    th.addEventListener("click", ()=>{
      const k = th.dataset.k;
      rankSort.dir = (rankSort.key===k) ? -rankSort.dir : -1;
      rankSort.key = k;
      paintRankings();
    });
  });
  paintRankings();
}
function paintRankings(){
  const key=rankSort.key, dir=rankSort.dir;
  const list2 = STORE.protocols.slice().sort((a,b)=>{
    let av=a[key], bv=b[key];
    if(typeof av==="string" || typeof bv==="string") return dir * String(av||"").localeCompare(String(bv||""));
    av = (av==null)? -Infinity: av; bv=(bv==null)? -Infinity: bv;
    return dir>0 ? (bv-av) : (av-bv);
  }).slice(0,60);
  document.querySelectorAll("thead th[data-k]").forEach(th=>th.classList.toggle("sorted", th.dataset.k===key));
  document.getElementById("rank-body").innerHTML = list2.map((p,i)=>`
    <tr data-open="${esc(p.id)}">
      <td class="rank-num">${i+1}</td>
      <td><div class="row-name"><img src="${p.logo||logoFallback(p.name)}" data-name="${esc(p.name)}" onerror="onImgErr(this)" loading="lazy" alt="">${esc(p.name)}</div></td>

  bindGlobalCardEvents(document.getElementById("rank-body"));
}

/* ---------------- Alerts (client-side, live price checks via DefiLlama coins API) ---------------- */
async function renderAlerts(){
  await loadData();
  const alerts = getAlerts();
  const withGecko = STORE.protocols.filter(p=>p.gecko_id).slice(0,150);
  setView(`
    <p class="eyebrow">Account</p>
    <h1 class="page-title">Alerts</h1>
    <p class="page-sub">Set a price target for any tracked token. Checked live while this tab is open, with a browser notification on trigger.</p>
    <div class="form-card" style="margin-bottom:28px">
      <div class="field-row">
        <div class="field">
          <label>Token</label>
          <select id="al-token">${withGecko.map(p=>`<option value="${p.gecko_id}" data-name="${esc(p.name)}">${esc(p.name)} (${esc(p.symbol||"")})</option>`).join("")}</select>
        </div>
        <div class="field">
          <label>Condition</label>
          <select id="al-cond"><option value="above">Price rises above</option><option value="below">Price falls below</option></select>
        </div>
      </div>
      <div class="field"><label>Target price (USD)</label><input id="al-price" type="number" step="any" placeholder="e.g. 3.50"></div>
      <button class="btn btn-primary" id="al-add">Create alert</button>
    </div>
    <div class="section-head"><h2>Your alerts</h2></div>
    <div id="al-list"></div>
  `);
  document.getElementById("al-add").addEventListener("click", ()=>{
    const sel = document.getElementById("al-token");
    const gecko_id = sel.value, name = sel.selectedOptions[0]?.dataset.name || sel.value;
    const cond = document.getElementById("al-cond").value;
    const price = parseFloat(document.getElementById("al-price").value);
    if(!price || price<=0){ toast("Enter a valid target price"); return; }
    const arr = getAlerts();
    arr.push({id:Date.now(), gecko_id, name, cond, price, triggered:false, created:Date.now()});
    setAlerts(arr);
    if("Notification" in window && Notification.permission==="default") Notification.requestPermission();
    toast(`Alert set for ${name}`);
    paintAlerts();
  });
  paintAlerts();
  checkAlertsNow();
}
function paintAlerts(){
  const arr = getAlerts().sort((a,b)=>b.created-a.created);
  const root = document.getElementById("al-list");
  if(!root) return;
  root.innerHTML = arr.length ? arr.map(a=>`
    <div class="press-item">
      <div>
        <p class="press-title">${esc(a.name)} ${a.cond==="above"?"↑":"↓"} $${a.price}</p>
        <p class="press-excerpt">${a.triggered? "Triggered — condition met." : "Watching…"} · created ${timeAgo(Math.floor(a.created/1000))}</p>
      </div>
      <button class="btn btn-sm btn-ghost" data-del="${a.id}">Remove</button>
    </div>`).join("") : `<div class="empty-state"><h3>No alerts yet</h3><p>Create one above to get notified on price moves.</p></div>`;
  root.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", ()=>{
    setAlerts(getAlerts().filter(a=>String(a.id)!==b.dataset.del));
    paintAlerts();
  }));
}
async function checkAlertsNow(){
  const arr = getAlerts().filter(a=>!a.triggered);
  if(!arr.length) return;
  const ids = [...new Set(arr.map(a=>"coingecko:"+a.gecko_id))].join(",");
  try{
    const data = await fetchJSON(COINS+"/prices/current/"+ids, 10000);
    let changed=false;
    arr.forEach(a=>{
      const p = data.coins?.["coingecko:"+a.gecko_id]?.price;
      if(p==null) return;
      if((a.cond==="above" && p>=a.price) || (a.cond==="below" && p<=a.price)){
        a.triggered=true; changed=true;
        toast(`⚡ ${a.name} ${a.cond==="above"?"rose above":"fell below"} $${a.price}`);
        if("Notification" in window && Notification.permission==="granted") new Notification("ApptoChain alert", {body:`${a.name} ${a.cond} $${a.price}`});
      }
    });
    if(changed){
      const all = getAlerts().map(x=>{ const m=arr.find(a=>a.id===x.id); return m? {...x, triggered:true} : x; });
      setAlerts(all);
      paintAlerts();
    }
  }catch(e){ /* silent — will retry next interval */ }
}
setInterval(()=>{ if(currentPath()==="/alerts") checkAlertsNow(); }, 45000);

  document.getElementById("drawer-close-btn").addEventListener("click", closeDrawer);
  document.getElementById("drawer-star").addEventListener("click", (e)=>{
    toggleWatch(p.id, p.name);
    e.target.textContent = getWatchlist().includes(p.id) ? "★ Watching" : "☆ Add to watchlist";
  });
  requestAnimationFrame(()=>{ backdrop.classList.add("open"); drawer.classList.add("open"); });
}
function closeDrawer(){
  document.getElementById("drawer-backdrop")?.classList.remove("open");
  document.getElementById("drawer")?.classList.remove("open");
}

/* ---------------- Global search ---------------- */
function initSearch(){
  const input = document.getElementById("global-search");
  const results = document.getElementById("search-results");
  const run = debounce(()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.classList.remove("open"); return; }
    const matches = STORE.protocols.filter(p=>p.name.toLowerCase().includes(q)).slice(0,8);
    results.innerHTML = matches.length ? matches.map(p=>`
      <div class="search-result-row" data-id="${esc(p.id)}">
        <img class="dapp-logo" style="width:26px;height:26px;border-radius:6px" src="${p.logo||logoFallback(p.name)}" data-name="${esc(p.name)}" onerror="onImgErr(this)" alt="">
        <div style="flex:1"><div style="font-weight:700;font-size:13px">${esc(p.name)}</div><div style="font-size:11px;color:var(--text-faint)">${esc(catLabel(p.bucket))}</div></div>
        <div class="mono" style="font-size:12px">${fmtUSD(p.tvl)}</div>
      </div>`).join("") : `<div class="search-result-empty">No matches for "${esc(input.value)}"</div>`;
    results.classList.add("open");
    results.querySelectorAll("[data-id]").forEach(row=>row.addEventListener("click", ()=>{
      openDrawer(row.dataset.id); results.classList.remove("open"); input.blur();
    }));
  }, 180);
  input.addEventListener("input", run);
  input.addEventListener("focus", run);
  document.addEventListener("click", (e)=>{ if(!e.target.closest(".search-wrap")) results.classList.remove("open"); });
  document.addEventListener("keydown", (e)=>{
    if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){
      e.preventDefault(); input.focus();
    }
    if(e.key==="Escape"){ results.classList.remove("open"); closeDrawer(); }
  });
}

/* ---------------- Mobile sidebar ---------------- */
function closeMobileSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-scrim").classList.remove("open");
}
function initMobileNav(){
  const toggle = document.getElementById("mobile-nav-toggle");
  const sidebar = document.getElementById("sidebar");
  const scrim = document.getElementById("sidebar-scrim");
  function setIcon(open){
    toggle.innerHTML = open
      ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
      : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  }
  toggle.addEventListener("click", ()=>{
    const willOpen = !sidebar.classList.contains("open");
    sidebar.classList.toggle("open", willOpen);
    scrim.classList.toggle("open", willOpen);
    setIcon(willOpen);
  });
  scrim.addEventListener("click", ()=>{ closeMobileSidebar(); setIcon(false); });
  document.querySelectorAll(".nav-item").forEach(el=>el.addEventListener("click", ()=>setIcon(false)));
  document.getElementById("mobile-wallet-toggle").addEventListener("click", connectWallet);
  document.getElementById("mobile-watchlist-toggle").addEventListener("click", ()=>navigate("/watchlist"));
  document.getElementById("mobile-alerts-toggle").addEventListener("click", ()=>navigate("/alerts"));
}

/* ---------------- Theme ---------------- */
function initTheme(){
  const saved = localStorage.getItem(LS_THEME) || "dark";
  document.documentElement.setAttribute("data-theme", saved);
  syncThemeIcon(saved);
  document.getElementById("theme-toggle").addEventListener("click", ()=>{
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur==="dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem(LS_THEME, next);
    syncThemeIcon(next);
  });
}
function syncThemeIcon(mode){
  document.getElementById("theme-icon-dark").style.display = mode==="dark" ? "block" : "none";
  document.getElementById("theme-icon-light").style.display = mode==="light" ? "block" : "none";
}
