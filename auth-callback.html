<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing in — AppToChain</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#000;color:#ededed;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:44px;height:44px;border:3px solid #1e1e1e;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
p{font-size:14px;color:#555}
</style>
</head>
<body>
<div class="spinner"></div>
<p>Completing sign in…</p>
<script>
const SUPABASE_URL = 'https://brculchgeyvwnhoeljjq.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyY3VsY2hnZXl2d25ob2VsampxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDcwNDMsImV4cCI6MjA5NjQ4MzA0M30.YbY5Wr4-PcvdI3gKZCJeQ8S7XY7YYWthnkq82MVj_WE'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

async function handleCallback() {
  try {
    const hash = window.location.hash
    const query = window.location.search
    const hashParams = new URLSearchParams(hash.slice(1))
    const queryParams = new URLSearchParams(query)

    const accessToken  = hashParams.get('access_token')
    const refreshToken = hashParams.get('refresh_token')
    const code         = queryParams.get('code')
    const errorMsg     = queryParams.get('error_description') || hashParams.get('error_description')
    const type         = hashParams.get('type') || queryParams.get('type')

    // If there's an error in the URL
    if (errorMsg) {
      window.location.href = 'login.html?error=' + encodeURIComponent(errorMsg)
      return
    }

    // Case 1: access_token in hash (OAuth or magic link)
    if (accessToken && refreshToken) {
      const { error } = await sb.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      })
      if (error) throw error
      window.location.href = 'dashboard.html'
      return
    }

    // Case 2: code in query string (PKCE flow - OAuth + email confirmation)
    if (code) {
      const { error } = await sb.auth.exchangeCodeForSession(code)
      if (error) throw error
      window.location.href = 'dashboard.html'
      return
    }

    // Case 3: already have a session
    const { data: { session } } = await sb.auth.getSession()
    if (session) {
      window.location.href = 'dashboard.html'
      return
    }

    // No auth found - go back to login
    window.location.href = 'login.html'

  } catch(e) {
    console.error('Auth callback error:', e)
    // Still try to redirect to dashboard in case session was set
    const { data: { session } } = await sb.auth.getSession()
    if (session) {
      window.location.href = 'dashboard.html'
    } else {
      window.location.href = 'login.html'
    }
  }
}

handleCallback()
</script>
</body>
</html>
