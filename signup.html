<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sign up — AppToChain</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{--bg:#000;--bg1:#0a0a0a;--bg2:#111;--bg3:#161616;--border:#222;--border2:#2a2a2a;--border3:#333;--text:#ededed;--text2:#a1a1a1;--text3:#666;--blue:#2563eb;--blue-light:#3b82f6;--green:#22c55e;--red:#ef4444}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 80% 80% at 50% 0%,black,transparent)}
.auth-nav{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;position:relative;z-index:10}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-size:14px;font-weight:700}
.nav-logo-box{width:24px;height:24px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.auth-nav-r{margin-left:auto;font-size:13px;color:var(--text3)}
.auth-nav-r a{color:var(--text2);text-decoration:none;font-weight:500}
.auth-nav-r a:hover{color:var(--text)}
.auth-body{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;z-index:1}
.auth-card{width:100%;max-width:420px}
.auth-card h1{font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px}
.auth-card .sub{font-size:13px;color:var(--text3);margin-bottom:28px}
.auth-card .sub a{color:var(--blue-light);text-decoration:none}
.auth-card .sub a:hover{text-decoration:underline}
.oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:38px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.12s;margin-bottom:10px;border:1px solid var(--border2);background:var(--bg1);color:var(--text)}
.oauth-btn:hover{border-color:var(--border3);background:var(--bg2)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;letter-spacing:0.04em;text-transform:uppercase}
.fg input{display:block;width:100%;height:38px;padding:0 12px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:border-color 0.12s}
.fg input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.fg input::placeholder{color:var(--text3)}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:40px}
.pass-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;display:flex;align-items:center}
.pass-eye:hover{color:var(--text2)}
.strength{height:3px;border-radius:2px;background:var(--border2);margin-top:6px;overflow:hidden}
.strength-fill{height:100%;border-radius:2px;transition:width 0.3s,background 0.3s;width:0}
.strength-lbl{font-size:10px;color:var(--text3);margin-top:4px}
.check-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px}
.check-row input[type=checkbox]{margin-top:1px;accent-color:var(--blue);flex-shrink:0}
.check-row label{font-size:12px;color:var(--text3);line-height:1.5}
.check-row label a{color:var(--blue-light);text-decoration:none}
.submit-btn{width:100%;height:40px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background 0.12s;display:flex;align-items:center;justify-content:center;gap:8px}
.submit-btn:hover{background:#1d4ed8}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed}
.err{display:none;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--red);margin-bottom:14px}
.err.show{display:block}
/* plan selector */
.plan-picker{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}
.pp-opt{border:1px solid var(--border2);border-radius:8px;padding:12px 10px;cursor:pointer;transition:all 0.12s;text-align:center}
.pp-opt:hover{border-color:var(--border3)}
.pp-opt.sel{border-color:var(--blue);background:rgba(37,99,235,0.07)}
.pp-name{font-size:12px;font-weight:700;margin-bottom:2px}
.pp-price{font-size:11px;color:var(--text3)}
@media(max-width:480px){
  .auth-body{align-items:flex-start;padding:28px 16px}
  .auth-card h1{font-size:20px}
  .fg-row{grid-template-columns:1fr}
  .plan-picker{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav class="auth-nav">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-box">A</div>AppToChain
  </a>
  <div class="auth-nav-r">Have an account? <a href="login.html">Sign in →</a></div>
</nav>

<div class="auth-body">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Already have one? <a href="login.html">Sign in</a></p>

    <a href="#" class="oauth-btn" onclick="return false">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </a>
    <a href="#" class="oauth-btn" onclick="return false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--text)"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      Continue with GitHub
    </a>

    <div class="divider">or sign up with email</div>

    <div class="err" id="err"></div>

    <div class="fg-row">
      <div class="fg"><label>First Name</label><input type="text" placeholder="Satoshi" id="fname"></div>
      <div class="fg"><label>Last Name</label><input type="text" placeholder="Nakamoto" id="lname"></div>
    </div>
    <div class="fg"><label>Email</label><input type="email" placeholder="you@example.com" id="email"></div>
    <div class="fg">
      <label>Password</label>
      <div class="pass-wrap">
        <input type="password" placeholder="Min. 8 characters" id="password" oninput="checkStrength(this.value)">
        <button class="pass-eye" onclick="togglePass()" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="strength"><div class="strength-fill" id="sfill"></div></div>
      <div class="strength-lbl" id="slbl"></div>
    </div>

    <div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:10px">Choose a plan</div>
      <div class="plan-picker">
        <div class="pp-opt sel" onclick="selectPlan(this)"><div class="pp-name">Hobby</div><div class="pp-price">Free forever</div></div>
        <div class="pp-opt" onclick="selectPlan(this)"><div class="pp-name">Pro</div><div class="pp-price">$49/mo</div></div>
        <div class="pp-opt" onclick="selectPlan(this)"><div class="pp-name">Enterprise</div><div class="pp-price">Custom</div></div>
      </div>
    </div>

    <div class="check-row">
      <input type="checkbox" id="agree">
      <label for="agree">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>. I may receive product updates.</label>
    </div>

    <button class="submit-btn" onclick="handleSignup()">Create account →</button>
  </div>
</div>

<script>
function togglePass(){const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';}
function checkStrength(v){
  const f=document.getElementById('sfill'),l=document.getElementById('slbl');
  if(!v){f.style.width='0';l.textContent='';return;}
  let s=0;
  if(v.length>=8)s++;if(v.length>=12)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[^a-zA-Z0-9]/.test(v))s++;
  const map=[[20,'#ef4444','Weak'],[40,'#f59e0b','Fair'],[60,'#f59e0b','Good'],[80,'#22c55e','Strong'],[100,'#22c55e','Very strong']];
  const [w,c,t]=map[Math.min(s-1,4)]||[20,'#ef4444','Weak'];
  f.style.width=w+'%';f.style.background=c;l.textContent=t;l.style.color=c;
}
function selectPlan(el){document.querySelectorAll('.pp-opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');}
function handleSignup(){
  const fname=document.getElementById('fname').value;
  const email=document.getElementById('email').value;
  const pass=document.getElementById('password').value;
  const agree=document.getElementById('agree').checked;
  const err=document.getElementById('err');
  if(!fname||!email||!pass){err.textContent='Please fill in all required fields.';err.classList.add('show');return;}
  if(pass.length<8){err.textContent='Password must be at least 8 characters.';err.classList.add('show');return;}
  if(!agree){err.textContent='Please agree to the Terms of Service.';err.classList.add('show');return;}
  err.classList.remove('show');
  const btn=document.querySelector('.submit-btn');btn.textContent='Creating account...';btn.disabled=true;
  setTimeout(()=>{window.location.href='dashboard.html';},900);
}
</script>
</body>
</html>
